[project]
name = "flash-net"
version = "0.1.0"
description = "Terminal flashcard game for learning the CompTIA Network+ acronyms"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
flash-net = "flash_net.game:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flash_net"]

[tool.pytest.ini_options]
testpaths = ["tests"]
